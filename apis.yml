apis:
- aid: agora-real-estate:agora-website-content-api
  name: Agora Website Content API
  description: >-
    The anonymous, read-mostly content API behind agorareal.com. The marketing site is a headless
    WordPress install at websiteapi.agorareal.com fronted by a Next.js application, and its WordPress
    REST API is served publicly — the self-describing route index at /wp-json returned HTTP 200 and
    326,828 bytes on 2026-09-12, declaring 295 routes across ten namespaces. Alongside the stock
    wp/v2 namespace, Agora ships its own first-party agora/v1 namespace of 25 routes purpose-built
    for the site: posts and case studies by slug, author detail and author batches, category batches,
    the cookie and privacy policies, the site map, Yoast redirects, theme settings, careers
    positions, and the "Season of Innovation" AI release feed. Every route sampled answered
    anonymously with real data. No OpenAPI is published by Agora; the specification in this repo was
    derived from that live route index.
  humanURL: https://agorareal.com/
  baseURL: https://websiteapi.agorareal.com/wp-json
