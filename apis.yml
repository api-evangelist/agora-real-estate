x-coverage:
  state: covered
  reason: covered
  detail: >-
    Agora publishes one genuinely callable API anonymously — the first-party website content API at
    https://websiteapi.agorareal.com/wp-json, whose self-describing route index (HTTP 200, 326,828
    bytes, 295 routes across ten namespaces, including Agora's own 25-route agora/v1 namespace) is
    the source the OpenAPI in this repo was derived from — plus a full OAuth 2.0 / OpenID Connect
    authorization server on its own domain at auth.agorareal.com, which serves both OIDC discovery
    and RFC 8414 metadata against a 404 control probe. What is NOT public is the product API: the
    investment-management platform is multi-tenant at https://{tenant}.acp.agorareal.com/api, every
    anonymous /api/* request returns nginx 502, app.agorareal.com answers {"message":"Not Found"} for
    every path including a control probe, and "API Access" appears on the pricing page only as an
    Enterprise line item marked "Priced Separately" with no reference, no specification and no
    developer portal anywhere on the 76-page site. Agora's own release feed dates that gap closing —
    a release titled "API + MCP" is scheduled for 2026-09-22 — so this profile is worth re-running
    after that date.
