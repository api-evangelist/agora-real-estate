aid: agora-real-estate
name: Agora Real Estate
description: >-
  Agora (agorareal.com) is a real estate investment management platform for general partners,
  syndicators, owners/operators and investment firms, covering fundraising and investor onboarding,
  an investor portal and investor CRM, digital subscriptions and e-signature, data rooms, cap table
  and transaction management, distribution waterfall automation, capital calls, ACH and cross-border
  payments, K-1 and document management, investor reporting, and integrated fund accounting,
  bookkeeping and tax services. It is sold as a subscription starting at $749/month for the Essential
  tier, with Pro and Enterprise tiers quoted, and its customer-facing platform is multi-tenant —
  every client firm gets its own investor portal and client-platform host under agorareal.com. Agora
  publishes no developer portal and no public reference for that platform API: "API Access" is an
  Enterprise line item priced separately, and the tenant API answers nothing anonymously. What it
  does publish anonymously is the first-party content API behind its own website, a headless
  WordPress install whose route index and custom agora/v1 namespace are served in the open, plus a
  full OAuth 2.0 / OpenID Connect authorization server on its own domain for the new Cortex AI
  product. Its own release feed schedules an "API + MCP" launch for 22 September 2026.
