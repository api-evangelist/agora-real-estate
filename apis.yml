apis:
- aid: agora-real-estate:agora-client-platform-api
  name: Agora Client Platform API
  description: >-
    The tenant-scoped HTTPS API behind Agora's client platform and investor portal. Its existence and
    shape are established from Agora's own production surface: certificate transparency shows per-tenant
    hosts under agorareal.com (390 <tenant>.acp.agorareal.com client-platform hosts, 389 <tenant>.portal.agorareal.com
    investor-portal hosts and 192 api.<tenant>.agorareal.com hosts), and the client-platform single-page
    app served from cdn-prod.acp.agorareal.com calls same-origin /api/* routes — /api/crm/..., /api/investor/...,
    /api/admin/cognito/..., /api/account-subscription — indicating AWS Cognito as the platform identity
    provider. The surface is unreachable anonymously: every anonymous request to /api and /api/* on the
    demo tenant and on sampled live tenants returned nginx HTTP 502, and app.agorareal.com (an AWS API
    Gateway custom domain) returns {"message":"Not Found"} for every path including a nonsense control
    probe. Agora publishes no reference, no OpenAPI and no authentication documentation for it; "API Access"
    appears on the pricing page as an Enterprise line item marked "Priced Separately". Recorded as a measured,
    gated surface — no operations, parameters or auth scheme are asserted.
  humanURL: https://agorareal.com/pricing/
  baseURL: https://{tenant}.acp.agorareal.com/api
  tags:
  - Investment Management
  - Investor Portal
  - CRM
  properties:
  - type: Pricing
    url: https://agorareal.com/pricing/
  - type: Login
    url: https://demo.portal.agorareal.com/
  x-access: gated
  x-evidence:
    discovered: '2026-09-12'
    method: probed
    source: https://cdn-prod.acp.agorareal.com/assets/src-DJsn4Q_l.js
    probes:
    - url: https://demo.acp.agorareal.com/api
      status: 502
    - url: https://alto.acp.agorareal.com/api
      status: 502
    - url: https://app.agorareal.com/
      status: 404
    - url: https://app.agorareal.com/openapi.json
      status: 404
    - url: https://app.agorareal.com/.well-known/zzz-api-evangelist-control-7c41
      status: 404
    base_url_note: >-
      Templated by design — the platform is multi-tenant and each client firm is served on its own <tenant>.acp.agorareal.com
      host. No single non-templated production host is published.
- aid: agora-real-estate:agora-authorization-server
  name: Agora Authorization Server
  description: >-
    Agora's OAuth 2.0 / OpenID Connect authorization server, served on its own domain at auth.agorareal.com
    and reached by redirect from the Cortex sign-in host (cortex.agorareal.com → auth.agorareal.com/?client_id=...).
    It publishes both RFC 8414 authorization-server metadata and OpenID Connect discovery anonymously:
    issuer https://auth.agorareal.com, authorization-code, refresh-token, device-code (urn:ietf:params:oauth:grant-type:device_code)
    and client-credentials grants, PKCE S256, RS256 ID tokens, and the scopes openid, profile, email and
    offline_access. The deployment is a WorkOS AuthKit hosted instance on Agora's own domain; no client
    registration is offered publicly, and the protected resources it fronts are not documented.
  humanURL: https://agorareal.com/cortex/
  baseURL: https://auth.agorareal.com
  tags:
  - Identity
  - Authentication
  - OpenID Connect
  tags_raw:
  - Identity
