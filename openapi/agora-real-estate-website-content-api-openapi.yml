            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
        '401':
          description: 'Not authenticated. Observed body: {"code":"rest_not_logged_in",...}.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
        '403':
          description: 'Authenticated but not permitted. Observed body: {"code":"rest_forbidden",...}.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
        '404':
          description: 'No route or record. Observed body: {"code":"rest_no_route",...} / {"code":"rest_post_invalid_id",...}.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestError'
      parameters:
      - name: id
        in: path
        required: true
        description: Unique identifier for the user.
        schema:
          type: integer
      - name: context
        in: query
        required: false
        description: Scope under which the request is made; determines fields present in response.
        schema:
          type: string
          enum:
          - view
          - embed
          - edit
          default: view
      security:
      - {}
components:
  securitySchemes:
    cookieNonce:
      type: apiKey
      in: header
      name: X-WP-Nonce
      description: WordPress cookie-authentication nonce. Advertised by the API in Access-Control-Allow-Headers;
        applies to write routes only.
    basicAuth:
      type: http
      scheme: basic
      description: WordPress application passwords sent as HTTP Basic in the Authorization header. Advertised
        in Access-Control-Allow-Headers; applies to write routes only.
  schemas:
    RestError:
      type: object
      description: WordPress REST error envelope, observed verbatim on live anonymous calls on 2026-09-12.
      properties:
        code:
          type: string
          description: Machine-readable error code, e.g. rest_no_route, rest_post_invalid_id, rest_forbidden,
            rest_not_logged_in.
        message:
          type: string
          description: Human-readable message.
        data:
          type: object
          properties:
            status:
              type: integer
              description: HTTP status code repeated in the body.
      required:
      - code
      - message
      examples:
      - code: rest_no_route
        message: No route was found matching the URL and request method.
        data:
          status: 404
security:
- {}
