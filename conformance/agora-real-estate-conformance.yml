- id: gdpr
  conforms: true
  status: fully-implemented
  evidence: Agora trust center framework list, https://trust.agorareal.com/ (2026-09-12).
domain_standards:
  note: >-
    Real estate investment management and private-fund administration have candidate domain standards
    — MISMO for mortgage and property data, the ILPA reporting templates for LP reporting and capital
    calls, FIX/SWIFT ISO 20022 for payment instructions, IRS Schedule K-1 e-file schemas. REWARD-ONLY:
    an absence is not a penalty. Agora's only public contract is a content API, so no domain standard
    can be asserted from a spec, and none is claimed in its public material.
  candidates:
  - id: mismo
    conforms: false
    evidence: No MISMO schema, namespace or claim appears in the public route index or on agorareal.com.
  - id: ilpa-reporting-template
    conforms: false
    evidence: >-
      Agora markets institutional report types and waterfall automation but names no ILPA template
      conformance on the pricing, reporting or investor-reporting pages.
  - id: iso-20022
    conforms: false
    evidence: >-
      ACH and cross-border payments are marketed (banking services provided by Thread Bank, Member
      FDIC) but no message-format conformance is published.
