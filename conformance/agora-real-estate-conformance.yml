- id: soc1
  conforms: true
  status: fully-implemented
  evidence: Agora trust center framework list, https://trust.agorareal.com/ (2026-09-12).
- id: iso-27001-2022
  conforms: true
  status: fully-implemented
  evidence: >-
    Agora trust center framework list plus https://agorareal.com/security-and-privacy/ — "Agora is in
